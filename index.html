<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Bubu 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6EA; --peach:#FFE3C7; --mango:#FFB23F; --mango-d:#F28C12;
    --okra:#6FAE3E; --okra-d:#3F7A25; --pink:#FF6F91; --pink-l:#FFD3DE;
    --ink:#5B3A2C; --ink-soft:#8A6656; --paper:#FFFDF8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{min-height:100%;background:#FFE3C7}
  body{min-height:100%}
  body{
    font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%, var(--cream) 0%, var(--peach) 70%, #FFD2AE 100%);  /* no "fixed" here: it stops images blending in some browsers */
    min-height:100dvh;overflow-x:hidden;
  }
  /* floating background hearts */
  .bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg-hearts span{position:absolute;bottom:-40px;color:var(--pink);opacity:.18;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}

  main{position:relative;max-width:460px;margin:0 auto;min-height:100dvh}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px 36px;text-align:center;opacity:0;visibility:hidden;transform:translateY(18px);
    transition:opacity .55s ease, transform .55s ease, visibility 0s linear .55s}
  .screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease, transform .55s ease;position:relative;min-height:100dvh}

  h1{font-size:clamp(26px,7.5vw,34px);line-height:1.15;font-weight:800;margin:6px 0 6px}
  .sub{font-size:17px;color:var(--ink-soft);line-height:1.4}

  /* placeholder look: tells YOU what to write; disappears once text is filled in */
  .ph{display:inline-block;border:2px dashed var(--mango-d);background:#FFF1D9;color:#A15C08;border-radius:10px;
    padding:3px 9px;font-family:"Baloo 2",sans-serif;font-size:14px;font-style:italic;font-weight:600;line-height:1.35;text-align:left}
  .ph::before{content:"✏️ "}
  button .ph{border-color:#fff;background:transparent;color:inherit;font-size:13px}
  button .ph::before{content:""}

  /* characters */
  .duo{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:190px;margin-bottom:6px}
  /* 🖼️ CHARACTER SIZE — every character gets the same box, so they always match */
  .char{display:flex;align-items:flex-end;justify-content:center;width:150px;height:170px;max-width:44vw;transform-origin:50% 100%;
    mix-blend-mode:multiply}          /* makes white / light backgrounds disappear into the page */
  .char img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;
    filter:brightness(1.08) contrast(1.12);   /* turns off-white backgrounds pure white so they vanish */
    -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 62%, transparent 100%);
            mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 62%, transparent 100%); /* softly fades the image edges */
  }
  /* If you use PNGs with a transparent background, you can delete mix-blend-mode and the 2 mask lines above. */
  /* the box you see when an image file is missing */
  .img-ph{width:130px;height:160px;border:2.5px dashed var(--mango-d);border-radius:16px;background:#FFF1D9;color:#A15C08;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:12.5px;font-weight:600;line-height:1.3;word-break:break-all}
  .img-ph b{font-size:26px}
  /* animation styles — pick one per image in CONFIG.images (anim) */
  .anim-bounce{animation:bob 2.8s ease-in-out infinite}
  .anim-shake{animation:wiggle 1.8s ease-in-out infinite}
  .anim-hug-left{animation:hugL 1.4s ease-in-out infinite}
  .anim-hug-right{animation:hugR 1.4s ease-in-out infinite}
  .anim-still{animation:none}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
  .photo{margin:14px auto 4px;max-width:86%;border-radius:18px;border:6px solid #fff;box-shadow:0 10px 26px rgba(140,70,20,.22);transform:rotate(-2deg)}
  .photo img{display:block;width:100%;border-radius:12px}
  .photo .img-ph{width:220px;height:150px}
  .front .img-ph{width:84px;height:84px;font-size:10px;padding:4px}
  .front img{max-width:84px;max-height:84px;object-fit:contain}

  /* passcode */
  .code-wrap{position:relative;margin:22px 0 8px;display:flex;align-items:center;gap:6px}
  .code-wrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;z-index:2;caret-color:transparent}
  .box{width:34px;height:46px;border-radius:12px;background:#fff;border:2.5px solid #F5C99A;display:grid;place-items:center;
    font-size:24px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #F5C99A;transition:border-color .2s, transform .2s}
  .box.filled{border-color:var(--mango);box-shadow:0 3px 0 var(--mango);transform:translateY(-2px)}
  .box.cursor{border-color:var(--pink);box-shadow:0 3px 0 var(--pink)}
  .sep{font-size:22px;color:#E3A773;font-weight:700}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  .msg{min-height:28px;margin-top:6px;font-size:16px;color:var(--pink);font-weight:600}

  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:19px;color:#fff;
    background:linear-gradient(180deg,#FF8AA6,var(--pink));padding:13px 30px;border-radius:999px;
    box-shadow:0 5px 0 #D94A6E, 0 10px 22px rgba(255,111,145,.35);transition:transform .12s, box-shadow .12s;margin-top:14px;min-width:150px}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D94A6E}
  .btn.green{background:linear-gradient(180deg,#86C557,var(--okra));box-shadow:0 5px 0 var(--okra-d),0 10px 22px rgba(63,122,37,.3)}

  /* envelope */
  .envelope{position:relative;width:270px;height:180px;margin:124px auto 18px;cursor:pointer;perspective:800px}
  .env-back{position:absolute;inset:0;background:#F7B26B;border-radius:12px;box-shadow:0 14px 30px rgba(140,70,20,.25)}
  .env-letter{position:absolute;left:16px;right:16px;top:14px;height:150px;background:var(--paper);border-radius:8px;
    transition:transform .8s cubic-bezier(.3,1.4,.5,1) .35s;display:grid;place-items:center;font-size:30px}
  .env-front{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none}
  .env-front::before,.env-front::after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
  .env-front::before{left:0;border-width:0 0 180px 135px;border-color:transparent transparent #FFC384 transparent}
  .env-front::after{right:0;border-width:0 135px 180px 0;border-color:transparent #FFBC78 transparent transparent}
  .env-bottom{position:absolute;left:0;right:0;bottom:0;height:96px;background:#FFCB91;clip-path:polygon(0 100%,50% 0,100% 100%);border-radius:0 0 12px 12px}
  .env-flap{position:absolute;left:0;right:0;top:0;height:110px;background:#F59F4E;clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top;transition:transform .5s ease;z-index:3}
  .seal{position:absolute;left:50%;top:84px;transform:translate(-50%,-50%);z-index:4;width:52px;height:52px;border-radius:50%;
    background:var(--pink);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 3px 0 #D94A6E;transition:opacity .3s, transform .3s}
  .env-back{z-index:1} .env-letter{z-index:2} .env-front,.env-bottom{z-index:3}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1;transition:transform .5s ease, z-index 0s .25s}
  .envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  .envelope.open .env-letter{transform:translateY(-80px)}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.04)}}

  /* letter */
  .screen.letter-screen{justify-content:flex-start;padding-top:34px}
  .paper{width:100%;background:var(--paper);border-radius:18px;padding:30px 24px 28px;text-align:left;position:relative;
    box-shadow:0 18px 40px rgba(140,70,20,.18);
    background-image:repeating-linear-gradient(transparent 0 33px, #F6E3CF 33px 34px);background-position:0 18px}
  .paper::before{content:"";position:absolute;left:18px;top:-12px;width:80px;height:26px;background:rgba(255,178,63,.55);transform:rotate(-4deg);border-radius:3px}
  .paper .l-title{font-family:"Kalam","Baloo 2",cursive;font-weight:700;font-size:26px;margin-bottom:8px}
  .paper p{font-family:"Kalam","Baloo 2",cursive;font-size:20px;line-height:34px;margin-bottom:12px}
  .paper .sign{text-align:right;margin-top:6px}
  .paper .mini{position:absolute;right:10px;bottom:-30px;width:70px;display:flex;justify-content:flex-end}
  .paper .mini img{max-width:70px;max-height:70px;object-fit:contain}
  .paper .mini .img-ph{width:70px;height:70px;font-size:9px;padding:3px}
  .paper .mini .img-ph b{font-size:16px}

  /* promises */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin:20px 0 6px}
  .card{perspective:900px;height:170px;cursor:pointer}
  .card-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .card.flipped .card-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
  .front{background:#fff;box-shadow:0 5px 0 #F5C99A}
  .front .num{font-size:15px;font-weight:800;color:var(--mango-d)}
  .front svg{width:64px;height:64px}
  .back{background:linear-gradient(160deg,#FFD08A,var(--mango));transform:rotateY(180deg);font-size:16px;line-height:1.35;font-weight:600;color:#5B2E0A;box-shadow:0 5px 0 var(--mango-d)}
  .back .ph{font-size:12.5px;background:#FFF7E8}

  /* question */
  .q-area{position:relative;width:100%;height:150px;margin-top:10px}
  #yesBtn{position:absolute;left:50%;top:20px;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 0;transition:transform .25s;margin:0}
  #noBtn{position:absolute;left:50%;top:100px;transform:translateX(-50%);margin:0;background:#fff;color:var(--ink-soft);
    box-shadow:0 5px 0 #E8CDB4;font-size:17px;min-width:110px;transition:left .25s ease, top .25s ease}
  #noBtn .ph{color:var(--ink-soft);border-color:#E8CDB4}
  #noBtn.free{position:fixed;transform:none;z-index:20}

  /* final */
  @keyframes hugL{50%{transform:translateX(6px) rotate(6deg)}}
  @keyframes hugR{50%{transform:translateX(-6px) rotate(-5deg)}}
  .big-heart{font-size:44px;color:var(--pink);animation:beat 1s ease-in-out infinite;margin-bottom:-14px}
  @keyframes beat{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
  .confetti{position:fixed;top:-30px;pointer-events:none;z-index:30;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media (max-width:360px){ .box{width:29px;height:42px;font-size:21px} .sep{font-size:18px} }
</style>
</head>
<body>
<div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

<main>
  <!-- 1. LOCK -->
  <section class="screen active" id="s-lock">
    <div class="duo" id="duoLock"></div>
    <h1 data-t="lockTitle"></h1>
    <p class="sub" data-t="lockHint"></p>
    <div class="code-wrap" id="codeWrap">
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Passcode">
      <div id="boxes" style="display:flex;align-items:center;gap:6px"></div>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="btn" id="unlockBtn" data-t="lockButton"></button>
  </section>

  <!-- 2. ENVELOPE -->
  <section class="screen" id="s-env">
    <h1 data-t="envelopeTitle"></h1>
    <div class="envelope pulse" id="envelope" role="button" aria-label="Open the letter" tabindex="0">
      <div class="env-back"></div>
      <div class="env-letter">💌</div>
      <div class="env-front"></div>
      <div class="env-bottom"></div>
      <div class="env-flap"></div>
      <div class="seal">♥</div>
    </div>
    <p class="sub" data-t="envelopeTap"></p>
  </section>

  <!-- 3. LETTER -->
  <section class="screen letter-screen" id="s-letter">
    <div class="paper">
      <div class="l-title" data-t="letterGreeting"></div>
      <p data-t="letter1"></p>
      <p data-t="letter2"></p>
      <p data-t="letter3"></p>
      <p data-t="letter4"></p>
      <p class="sign" data-t="signoff"></p>
      <div class="mini" id="miniBhindi"></div>
    </div>
    <button class="btn" style="margin-top:40px" data-go="s-promises" data-t="letterNext"></button>
  </section>

  <!-- 4. PROMISES -->
  <section class="screen" id="s-promises">
    <h1 data-t="promisesTitle"></h1>
    <p class="sub" data-t="promisesHint"></p>
    <div class="cards" id="cards"></div>
    <button class="btn" data-go="s-ask" data-t="promisesNext"></button>
  </section>

  <!-- 5. ASK -->
  <section class="screen" id="s-ask">
    <div class="duo" id="duoAsk"></div>
    <h1 data-t="askQuestion"></h1>
    <p class="sub" id="plead" aria-live="polite" style="min-height:26px"></p>
    <div class="q-area">
      <button class="btn green" id="yesBtn" data-t="yesButton"></button>
      <button class="btn" id="noBtn" data-t="noButton"></button>
    </div>
  </section>

  <!-- 6. FINAL -->
  <section class="screen" id="s-final">
    <div class="big-heart">♥</div>
    <div class="duo" id="duoFinal"></div>
    <h1 data-t="finalTitle"></h1>
    <p class="sub" data-t="finalMessage" style="font-size:18px"></p>
    <div class="photo" id="couplePhoto"></div>
  </section>
</main>

<script>
/* =====================================================================
   EVERYTHING YOU NEED TO EDIT IS HERE.
   Each line is:  key: ["YOUR TEXT", "guide for you"]
   Leave YOUR TEXT empty ("") and the page shows the guide as a dashed
   placeholder. Fill it in and the placeholder disappears.
   ===================================================================== */
const CONFIG = {
  /* ###################################################################
     🖼️  YOUR IMAGES — REPLACE HERE  🖼️
     -------------------------------------------------------------------
     HOW:  make a folder called  images  next to this index.html file,
           and save your pictures in it with EXACTLY these names
           (or change the path on the right to match your file name).
     Any type works: .png  .jpg  .gif  .webp
     Tip: PNG/GIF with a transparent background looks best for characters.
     Size: ~400–800px tall, under 1 MB each.
     If a file is missing, the page shows a dashed box with its name.

     anim = how it moves:
        "bounce"  gentle up-down
        "shake"   little sad wiggle
        "hug-left"  / "hug-right"   lean towards each other
        "still"   no movement

     size = make ONE character bigger or smaller so both look equal
        1 = normal,  1.3 = 30% bigger,  0.8 = 20% smaller
     ################################################################### */
  images: {
    // LOCK SCREEN (first screen)
    lockMe:    { src: "images/lock-me.jpeg",    anim: "shake", size: 1.3 },  // 🖼️ you, sorry  ← bigger, to match her
    lockHer:   { src: "images/lock-her.jpeg",   anim: "bounce", size: 1 },  // 🖼️ her, upset

    // QUESTION SCREEN ("Will you forgive me?")
    askMe:     { src: "images/ask-me.jpeg",     anim: "shake", size: 1  },  // 🖼️ you, pleading
    askHer:    { src: "images/ask-her.jpeg",    anim: "bounce", size: 1 },  // 🖼️ her, thinking

    // FINAL SCREEN (after she says yes)
    finalMe:   { src: "images/final-me.jpeg",   anim: "hug-left", size: 1  }, // 🖼️ you, happy
    finalHer:  { src: "images/final-her.jpeg",  anim: "hug-right", size: 1 }, // 🖼️ her, happy
    couplePhoto: { src: "images/couple.jpeg",   anim: "still", size: 1 },     // 🖼️ a photo of you two (set src: "" to hide)

    // SMALL STICKER at the bottom corner of the letter
    letterSticker: { src: "images/sticker.jpeg", anim: "bounce", size: 1 },   // 🖼️ (set src: "" to hide)

    // PROMISE CARD ICONS (front of the 4 cards). Leave "" to use the built-in heart / star icons.
    card1: { src: "", anim: "still", size: 1 },   // 🖼️ e.g. "images/card1.png"
    card2: { src: "", anim: "still", size: 1 },   // 🖼️
    card3: { src: "", anim: "still", size: 1 },   // 🖼️
    card4: { src: "", anim: "still", size: 1 }    // 🖼️
  },
  /* ################ END OF IMAGES ################ */

  // The special date, digits only, as DDMMYYYY.  e.g. 14 June 2023 -> "14062023"
  passcode: "28012024",            // 28 Jan 2024
  codeGroups: [2, 2, 4],          // shown as  __ / __ / ____

  text: {
    // LOCK SCREEN
    lockTitle:      ["Pyaari Bubu", "1 short line greeting her (Bubu / Radhu)"],
    lockHint:       ["Hmara sbse important date", "Hint for the date, without giving it away"],
    lockButton:     ["Click Here", "Button: 'Open'"],
    wrongCode:      ["Wrong Password Bubu", "Playful line when the date is wrong"],
    rightCode:      ["Yeah!! Shi jawaab", "Happy line when the date is right"],

    // ENVELOPE
    envelopeTitle:  ["Meri sbse important person k liye ❤️", "1 line: 'I wrote something for you'"],
    envelopeTap:    ["Envelopr pr tap krna", "Small line: 'Tap the envelope'"],

    // LETTER (the heart of the apology)
    letterGreeting: ["Meri Pyaari Radhika", "Opening: 'Dear Radhu,' / 'Meri Bubu,'"],
    letter1:        ["Maine jo kiya h uske liye shyd m maafi ka haqdaar ni pr m kbhi ni chahta tha tmhra dil dukhana", "Para 1 – Say sorry plainly. Name what you did. No excuses, no 'but'."],
    letter2:        ["Tmhe khush krna tmhre sth hr pal bitana m bs itna hi chahta hu mjhe tmhre sth hone ka jitna pride h utna kbhi kisis or chiz ka ni rha", "Para 2 – Show you understand how it made HER feel."],
    letter3:        ["M tmse bahut pyaar krta hu Radhika maine tmhe kbhi na dhokha diya h or na kbhi dunga aisa kbhi kch ni hoga", "Para 3 – What you will do differently from now on (be specific)."],
    letter4:        ["Mere liye tmhra hona meri lyf m sbse important or badi khushi phle bhi thi or hmesha rhegi", "Para 4 – What she means to you; maybe one favourite memory together."],
    signoff:        ["Motka Dudu", "Sign-off: 'Your ___' + your name"],
    letterNext:     ["Click krna", "Button: 'Next'"],

    // PROMISE CARDS (she taps each one to flip it)
    promisesTitle:  ["M tmse ye saare vaade krta hu", "Heading: 'My promises to you'"],
    promisesHint:   ["Click krna", "Small line: 'Tap each card'"],
    promise1:       ["Tmhe kbhi bura feel ni krvaunga tm mere liye hmesha sbse important thi or rhogi", "Promise 1 – e.g. a Mango Sorbet date at Polar Bear, on you"],
    promise2:       ["Tmhe kbhi gussa ni dilaunga hmesha tmhra khyaal rkhunga", "Promise 2 – e.g. you'll cook her bhindi"],
    promise3:       ["Tmhra hr samay m hmesha pura sth dunga", "Promise 3 – a serious one, linked to what went wrong"],
    promise4:       ["Hmesha saaf safai rkhunga 🥲", "Promise 4 – something sweet / silly only you two get"],
    promisesNext:   ["Akhri click", "Button: 'One last thing…'"],

    // THE QUESTION
    askQuestion:    ["Kya tm mjhe maaf krogi?", "The big question: 'Will you forgive me?'"],
    yesButton:      ["", "'Yes'"],
    noButton:       ["", "'No'"],
    plead1:         ["Plzzzzz bubu maaf krdo 🥺🥺", "Shown when she tries 'No' (1st time)"],
    plead2:         ["Abse kbhi ni kch gadbad krunga 🥺😭", "Shown when she tries 'No' (2nd time)"],
    plead3:         ["Akhri baar plzzzzz bubu 😭😭", "Shown when she tries 'No' (3rd time onwards)"],

    // FINAL SCREEN
    finalTitle:     ["Thankyou so much Bubu 🥰🥰🥰🥰🥰", "Celebration line after she says yes"],
    finalMessage:   ["M promise krta hu m or tm hmesha khushi se rhnge 😊😊, I LOVE YOU HMESHA SBSE ZYDA ❤️❤️❤️", "Last sweet message from you"]
  }
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const T = CONFIG.text;
function fill(el, key){
  const v = T[key]; if(!v) return;
  if(v[0] && v[0].trim()) { el.textContent = v[0]; }
  else { el.innerHTML = ''; const s = document.createElement('span'); s.className='ph'; s.textContent = v[1]; el.appendChild(s); }
}
function say(el, key){ fill(el, key); }

/* ---------- 🖼️ image slots (reads CONFIG.images) ---------- */
function placeholderBox(src){
  const d=document.createElement('div'); d.className='img-ph';
  d.innerHTML='<b>🖼️</b><span></span>'; d.querySelector('span').textContent = src || 'add image';
  return d;
}
// puts the image CONFIG.images[key] into element el (or a dashed box if the file is missing)
function putImage(el, key, wrapClass){
  const cfg = CONFIG.images[key] || {src:''};
  const wrap = document.createElement('div');
  wrap.className = (wrapClass||'') + ' anim-' + (cfg.anim||'still');
  if(cfg.src){
    const img = new Image(); img.alt=''; img.src = cfg.src;
    if(cfg.size && cfg.size!==1){ img.style.transform='scale('+cfg.size+')'; img.style.transformOrigin='50% 100%'; }
    img.onerror = ()=> img.replaceWith(placeholderBox(cfg.src));
    wrap.appendChild(img);
  } else return false;
  el.appendChild(wrap); return true;
}
const heartIcon = '<svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 54 C10 40 6 28 10 20 C14 12 26 10 32 20 C38 10 50 12 54 20 C58 28 54 40 32 54Z" fill="#FF6F91"/></svg>';
const starIcon  = '<svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 6 L39 24 L58 25 L43 37 L48 56 L32 45 L16 56 L21 37 L6 25 L25 24Z" fill="#FFB23F" stroke="#F28C12" stroke-width="2" stroke-linejoin="round"/></svg>';

/* ---------- build ---------- */
document.querySelectorAll('[data-t]').forEach(el => fill(el, el.dataset.t));
putImage($('#duoLock'),  'lockMe',  'char');  putImage($('#duoLock'),  'lockHer',  'char');
putImage($('#duoAsk'),   'askMe',   'char');  putImage($('#duoAsk'),   'askHer',   'char');
putImage($('#duoFinal'), 'finalMe', 'char');  putImage($('#duoFinal'), 'finalHer', 'char');
if(!putImage($('#couplePhoto'), 'couplePhoto')) $('#couplePhoto').remove();
if(!putImage($('#miniBhindi'), 'letterSticker')) $('#miniBhindi').remove();

const icons = [heartIcon, starIcon, heartIcon, starIcon];
const cardsEl = $('#cards');
['promise1','promise2','promise3','promise4'].forEach((k,i)=>{
  const c = document.createElement('div'); c.className='card'; c.tabIndex=0; c.setAttribute('role','button');
  c.innerHTML = `<div class="card-in"><div class="face front"><div class="num">#${i+1}</div>${icons[i]}</div><div class="face back"></div></div>`;
  fill(c.querySelector('.back'), k);
  const front = c.querySelector('.front'), icon = front.querySelector('svg');
  const holder = document.createElement('div');
  if(putImage(holder, 'card'+(i+1))){ icon.replaceWith(holder.firstChild); }
  const flip = ()=> c.classList.toggle('flipped');
  c.addEventListener('click', flip);
  c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();} });
  cardsEl.appendChild(c);
});

/* floating background hearts */
(function(){
  const bg = $('#bgHearts');
  for(let i=0;i<14;i++){
    const s=document.createElement('span'); s.textContent='♥';
    s.style.left = Math.random()*100+'vw';
    s.style.fontSize = (14+Math.random()*22)+'px';
    s.style.animationDuration = (9+Math.random()*10)+'s';
    s.style.animationDelay = (-Math.random()*18)+'s';
    bg.appendChild(s);
  }
})();

/* ---------- navigation ---------- */
function go(id){
  document.querySelectorAll('.screen.active').forEach(s=>s.classList.remove('active'));
  const n = document.getElementById(id); n.classList.add('active');
  window.scrollTo({top:0});
  if(id==='s-final') confetti();
}
document.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=> go(b.dataset.go)));

/* ---------- passcode ---------- */
const code = $('#code'), boxes = $('#boxes'), LEN = CONFIG.passcode.length;
function renderBoxes(){
  const v = code.value; boxes.innerHTML=''; let idx=0;
  CONFIG.codeGroups.forEach((g,gi)=>{
    for(let j=0;j<g;j++,idx++){
      const b=document.createElement('div'); b.className='box';
      if(v[idx]){ b.textContent=v[idx]; b.classList.add('filled'); }
      else if(idx===v.length && document.activeElement===code) b.classList.add('cursor');
      boxes.appendChild(b);
    }
    if(gi < CONFIG.codeGroups.length-1){ const s=document.createElement('span'); s.className='sep'; s.textContent='/'; boxes.appendChild(s); }
  });
}
code.maxLength = LEN;
code.addEventListener('input', ()=>{
  code.value = code.value.replace(/\D/g,'').slice(0,LEN);
  $('#msg').textContent=''; renderBoxes();
  if(code.value.length===LEN) check();
});
code.addEventListener('focus', renderBoxes); code.addEventListener('blur', renderBoxes);
code.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
$('#unlockBtn').addEventListener('click', ()=>{ if(code.value.length<LEN){ code.focus(); return; } check(); });
let unlocked=false;
function check(){
  if(unlocked) return;
  const msg = $('#msg');
  if(code.value === CONFIG.passcode){
    unlocked=true; say(msg,'rightCode'); msg.style.color='var(--okra-d)';
    code.blur(); setTimeout(()=>go('s-env'), 900);
  } else {
    say(msg,'wrongCode'); msg.style.color='var(--pink)';
    const w=$('#codeWrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
    setTimeout(()=>{ code.value=''; renderBoxes(); }, 500);
  }
}
renderBoxes();

/* ---------- envelope ---------- */
const env = $('#envelope');
function openEnv(){ if(env.classList.contains('open')) return; env.classList.remove('pulse'); env.classList.add('open'); setTimeout(()=>go('s-letter'), 1500); }
env.addEventListener('click', openEnv);
env.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv();} });

/* ---------- runaway NO ---------- */
const noBtn=$('#noBtn'), yesBtn=$('#yesBtn'); let tries=0;
function runAway(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  tries++;
  say($('#plead'), tries===1?'plead1':tries===2?'plead2':'plead3');
  yesBtn.style.setProperty('--s', Math.min(1+tries*0.12, 1.7));
  const r = noBtn.getBoundingClientRect(), y = yesBtn.getBoundingClientRect();
  noBtn.classList.add('free');
  const W=window.innerWidth, H=window.innerHeight, m=12;
  let x,yy,guard=0;
  do{
    x = m + Math.random()*(W - r.width - 2*m);
    yy = m + Math.random()*(H - r.height - 2*m);
    guard++;
  } while(guard<40 && (
     (x < y.right+10 && x+r.width > y.left-10 && yy < y.bottom+10 && yy+r.height > y.top-10) ||
     (Math.abs(x-r.left)<70 && Math.abs(yy-r.top)<50)
  ));
  noBtn.style.left = x+'px'; noBtn.style.top = yy+'px';
}
noBtn.addEventListener('pointerdown', runAway);
noBtn.addEventListener('mouseenter', runAway);
noBtn.addEventListener('click', runAway);
noBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') runAway(e); });
yesBtn.addEventListener('click', ()=>{ noBtn.style.display='none'; go('s-final'); });

/* ---------- confetti ---------- */
function confetti(){
  const colors=['#FF6F91','#FFB23F','#6FAE3E','#FFD3DE','#F28C12'];
  const chars=['♥','♥','●','■','♥'];
  for(let i=0;i<70;i++){
    const s=document.createElement('span'); s.className='confetti';
    s.textContent=chars[i%chars.length];
    s.style.left=Math.random()*100+'vw';
    s.style.color=colors[i%colors.length];
    s.style.fontSize=(10+Math.random()*16)+'px';
    s.style.animationDuration=(2.4+Math.random()*2.6)+'s';
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 6500);
  }
}
</script>
